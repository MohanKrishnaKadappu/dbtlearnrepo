version: 2

sources:
  - name: ecommerce
    database: raw
    schema: ecommerce
    tables:
      - name: raw_customers
      - name: raw_orders
  - name: rawsource
    database: DEMO_DB
    schema: PUBLIC
    tables:
      - name: raw_orders
      - name: bank_transactions_raw
      - name: customers
      - name: orders

  - name: raw_layer
    database: DEMO_DB
    schema: PIPELINE
    tables:
      - name: stg_customer
        description: "Staging table for customer data"
      - name: item
        description: "Staging table for item data"
  - name: practice
    database: DBT_PRACTICE
    schema: PUBLIC
    tables:
      - name: customer
        description: "Staging table for customer data"
      - name: orders
        description: "Staging table for orders data"